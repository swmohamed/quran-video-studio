name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the goal or difficulty, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like the app to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Optional — existing features or workarounds you tried.
